<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="Remote Mouse"><title>Remote Mouse</title><style>
  .f{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{animation:ring 2s ease-out infinite}
  .glow{animation:glow 6s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="gc03" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff0d" stroke-width="1"/></pattern>
      <radialGradient id="cg03" cx="100%" cy="0%" r="80%"><stop offset="0" stop-color="#a3f02e" stop-opacity=".14"/><stop offset="1" stop-color="#a3f02e" stop-opacity="0"/></radialGradient>
      <clipPath id="cc03"><rect width="590" height="300" rx="24"/></clipPath></defs>
    <g clip-path="url(#cc03)">
      <rect width="590" height="300" fill="#111317"/>
      <rect width="590" height="300" fill="url(#gc03)" opacity=".7"/>
      <rect width="590" height="300" fill="url(#cg03)"/>
      <text x="32" y="50" class="m" font-size="14" fill="#5b5f68">03</text>
      <text x="68" y="50" class="m" font-size="13" letter-spacing="2" fill="#8c909a">INTERNAL TOOLS</text>
      <circle cx="540" cy="46" r="20" fill="#171a1f" stroke="#ffffff29"/>
      <path d="M534 52 L546 40 M537 40 H546 V49" fill="none" stroke="#a3f02e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="128" class="f" font-size="40" font-weight="700" letter-spacing="-1.2" fill="#f3f4ee">Remote Mouse</text><text x="32" y="166" class="f" font-size="17" fill="#8c909a">Turns your phone into a wireless</text><text x="32" y="192" class="f" font-size="17" fill="#8c909a">touchpad for your PC, in real time.</text><rect x="32" y="236" width="44.4" height="28" rx="14.0" fill="#171a1f" stroke="#ffffff14"/><text x="54.2" y="254.5" text-anchor="middle" class="m" font-size="13" fill="#8c909a">C#</text><rect x="84.4" y="236" width="52.599999999999994" height="28" rx="14.0" fill="#171a1f" stroke="#ffffff14"/><text x="110.7" y="254.5" text-anchor="middle" class="m" font-size="13" fill="#8c909a">WPF</text><rect x="145.0" y="236" width="69.0" height="28" rx="14.0" fill="#171a1f" stroke="#ffffff14"/><text x="179.5" y="254.5" text-anchor="middle" class="m" font-size="13" fill="#8c909a">React</text><text x="558" y="256" text-anchor="end" class="m" font-size="14" fill="#5b5f68">2026</text></g><rect x=".5" y=".5" width="589" height="299" rx="24" fill="none" stroke="#ffffff29"/></svg>