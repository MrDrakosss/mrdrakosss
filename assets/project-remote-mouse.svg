<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Remote Mouse"><title>Remote Mouse</title><style>
  .f{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{animation:ring 2s ease-out infinite}
  .glow{animation:glow 6s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="gc03" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff0d" stroke-width="1"/></pattern>
      <radialGradient id="cg03" cx="100%" cy="0%" r="60%"><stop offset="0" stop-color="#a3f02e" stop-opacity=".16"/><stop offset="1" stop-color="#a3f02e" stop-opacity="0"/></radialGradient>
      <clipPath id="cc03"><rect width="1200" height="210" rx="24"/></clipPath></defs>
    <g clip-path="url(#cc03)">
      <rect width="1200" height="210" fill="#111317"/>
      <rect width="1200" height="210" fill="url(#gc03)" opacity=".7"/>
      <rect width="1200" height="210" fill="url(#cg03)"/>
      <text x="40" y="56" class="m" font-size="16" fill="#5b5f68">03</text>
      <text x="80" y="56" class="m" font-size="15" letter-spacing="2" fill="#8c909a">INTERNAL TOOLS</text>
      <text x="38" y="122" class="f" font-size="50" font-weight="700" letter-spacing="-1.5" fill="#f3f4ee">Remote Mouse</text><rect x="40" y="148" width="48.8" height="32" rx="16.0" fill="#171a1f" stroke="#ffffff14"/><text x="64.4" y="168.5" text-anchor="middle" class="m" font-size="15" fill="#8c909a">C#</text><rect x="98.8" y="148" width="58.2" height="32" rx="16.0" fill="#171a1f" stroke="#ffffff14"/><text x="127.9" y="168.5" text-anchor="middle" class="m" font-size="15" fill="#8c909a">WPF</text><rect x="167.0" y="148" width="77.0" height="32" rx="16.0" fill="#171a1f" stroke="#ffffff14"/><text x="205.5" y="168.5" text-anchor="middle" class="m" font-size="15" fill="#8c909a">React</text><text x="560" y="96" class="f" font-size="23" fill="#8c909a">Turns your phone into a wireless</text><text x="560" y="130" class="f" font-size="23" fill="#8c909a">touchpad for your PC, in real time.</text><text x="1160" y="56" text-anchor="end" class="m" font-size="16" fill="#5b5f68">2026</text>
      <circle cx="1132" cy="128" r="28" fill="#171a1f" stroke="#ffffff29"/>
      <path d="M1124 136 L1140 120 M1128 120 H1140 V132" fill="none" stroke="#a3f02e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
