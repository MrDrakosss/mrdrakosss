<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="SeasonFX"><title>SeasonFX</title><style>
  .f{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{animation:ring 2s ease-out infinite}
  .glow{animation:glow 6s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
