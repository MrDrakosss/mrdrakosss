<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="All projects"><title>All projects</title><style>
  .f{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{animation:ring 2s ease-out infinite}
  .glow{animation:glow 6s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="gap" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff0d" stroke-width="1"/></pattern>
      <radialGradient id="apg" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#a3f02e" stop-opacity=".22"/><stop offset="1" stop-color="#a3f02e" stop-opacity="0"/></radialGradient>
      <clipPath id="apc"><rect width="590" height="300" rx="24"/></clipPath></defs>
    <g clip-path="url(#apc)">
      <rect width="590" height="300" fill="#0c0e11"/>
      <rect width="590" height="300" fill="url(#gap)"/>
      <rect width="590" height="300" fill="url(#apg)" class="glow"/>
      <rect x="20" y="20" width="550" height="260" rx="18" fill="none" stroke="#a3f02e" stroke-opacity=".5" stroke-dasharray="8 8" style="animation:dash 2s linear infinite"/>
      <text x="295.0" y="136" text-anchor="middle" class="m" font-size="14" letter-spacing="3" fill="#a3f02e">GITHUB</text>
      <text x="295.0" y="184" text-anchor="middle" class="f" font-size="38" font-weight="700" letter-spacing="-1.2" fill="#f3f4ee">All projects →</text>
    </g>
    <rect x=".5" y=".5" width="589" height="299" rx="24" fill="none" stroke="#ffffff29"/></svg>