<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="whoami — Xavér, fullstack dev"><title>whoami — Xavér, fullstack dev</title><style>
  .f{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{animation:ring 2s ease-out infinite}
  .glow{animation:glow 6s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.t0{animation:fadeUp .5s ease-out 0.40s both}.t1{animation:fadeUp .5s ease-out 0.95s both}.t2{animation:fadeUp .5s ease-out 1.50s both}.t3{animation:fadeUp .5s ease-out 2.05s both}.t4{animation:fadeUp .5s ease-out 2.60s both}.t5{animation:fadeUp .5s ease-out 3.15s both}</style><defs><pattern id="gt" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff0d" stroke-width="1"/></pattern>
      <radialGradient id="tg" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#a3f02e" stop-opacity=".14"/><stop offset="1" stop-color="#a3f02e" stop-opacity="0"/></radialGradient>
      <clipPath id="tc"><rect width="1200" height="410" rx="22"/></clipPath></defs>
    <g clip-path="url(#tc)">
      <rect width="1200" height="410" fill="#111317"/>
      <rect width="1200" height="410" fill="url(#gt)" opacity=".5"/>
      <rect width="1200" height="410" fill="url(#tg)"/>
      <rect width="1200" height="52" fill="#171a1f"/>
      <line x1="0" y1="52" x2="1200" y2="52" stroke="#ffffff14"/>
      <circle cx="30" cy="26" r="7" fill="#ff6b5e"/><circle cx="54" cy="26" r="7" fill="#f0c62e"/><circle cx="78" cy="26" r="7" fill="#a3f02e"/>
      <text x="600.0" y="31" text-anchor="middle" class="m" font-size="14" fill="#5b5f68">xaver@shelter: ~</text><g class="t0"><text x="32" y="96" class="m" font-size="20"><tspan fill="#a3f02e">❯</tspan><tspan fill="#f3f4ee" dx="10">whoami</tspan></text>
          <text x="56" y="123" class="m" font-size="17" fill="#8c909a">Xavér — fullstack dev, founder of Shelter Team Studio, part-time Minecraft wizard</text></g><g class="t1"><text x="32" y="156" class="m" font-size="20"><tspan fill="#a3f02e">❯</tspan><tspan fill="#f3f4ee" dx="10">cat skills.txt</tspan></text>
          <text x="56" y="183" class="m" font-size="17" fill="#8c909a">turning coffee into code · code into bugs · bugs into "features"</text></g><g class="t2"><text x="32" y="216" class="m" font-size="20"><tspan fill="#a3f02e">❯</tspan><tspan fill="#f3f4ee" dx="10">uptime</tspan></text>
          <text x="56" y="243" class="m" font-size="17" fill="#8c909a">servers: 24/7  ·  me: questionable</text></g><g class="t3"><text x="32" y="276" class="m" font-size="20"><tspan fill="#a3f02e">❯</tspan><tspan fill="#f3f4ee" dx="10">git blame prod.js</tspan></text>
          <text x="56" y="303" class="m" font-size="17" fill="#8c909a">it wasn't me. it was the intern. (I am the intern.)</text></g><g class="t4"><text x="32" y="336" class="m" font-size="20"><tspan fill="#a3f02e">❯</tspan><tspan fill="#f3f4ee" dx="10">sudo make me a sandwich</tspan></text>
          <text x="56" y="363" class="m" font-size="17" fill="#8c909a">okay. but first, let me deploy on a Friday.</text></g><g class="t5"><text x="32" y="396" class="m" font-size="17" fill="#a3f02e">❯</text>
      <rect x="54" y="381" width="10" height="19" fill="#a3f02e" class="blink"/></g>
    </g><rect x=".5" y=".5" width="1199" height="409" rx="22" fill="none" stroke="#ffffff29"/></svg>