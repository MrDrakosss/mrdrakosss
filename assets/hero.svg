<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Hi, I'm Xavér — You dream it. I ship it."><title>Hi, I'm Xavér — You dream it. I ship it.</title><style>
  .f{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ring{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{animation:ring 2s ease-out infinite}
  .glow{animation:glow 6s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

      .ul{stroke-dasharray:520;animation:draw 1.6s cubic-bezier(.16,1,.3,1) .5s both}
      .l1{animation:fadeUp .9s cubic-bezier(.16,1,.3,1) both}
      .l2{animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .15s both}
      .l3{animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .3s both}
    </style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff0d" stroke-width="1"/></pattern>
      <radialGradient id="rg" cx="50%" cy="0%" r="65%"><stop offset="0" stop-color="#a3f02e" stop-opacity=".24"/><stop offset="1" stop-color="#a3f02e" stop-opacity="0"/></radialGradient>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#07080a" stop-opacity="0"/><stop offset="1" stop-color="#07080a"/></linearGradient>
      <clipPath id="clip"><rect width="1200" height="460" rx="28"/></clipPath>
    </defs>
    <g clip-path="url(#clip)">
      <rect width="1200" height="460" fill="#07080a"/>
      <rect width="1200" height="460" fill="url(#g)"/>
      <rect width="1200" height="460" fill="url(#rg)" class="glow"/>
      <rect width="1200" height="460" fill="url(#fade)"/>

      <g class="l1">
        <rect x="420.0" y="62" width="360" height="36" rx="18" fill="#111317" stroke="#ffffff29"/>
        <rect x="426.0" y="68" width="40" height="24" rx="12" fill="#a3f02e"/>
        <text x="446.0" y="85" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#0a0d05">Hi</text>
        <circle cx="482.0" cy="80" r="4" fill="#a3f02e" class="pulse"/>
        <text x="496.0" y="85" class="f" font-size="14" fill="#8c909a">Founder @ Shelter Team Studio</text>
      </g>
      <g class="l2">
        <text x="600.0" y="190" text-anchor="middle" class="f" font-size="68" font-weight="700" letter-spacing="-2.5" fill="#f3f4ee">I'm Xavér.</text>
        <text x="268.0" y="268" class="f" font-size="68" font-weight="700" textLength="405" lengthAdjust="spacingAndGlyphs" fill="#f3f4ee">You dream it.</text>
        <text x="692.0" y="268" class="f" font-size="68" font-weight="700" textLength="240" lengthAdjust="spacingAndGlyphs" fill="#a3f02e">I ship it.</text>
        <path class="ul" d="M692.0 290 C 772.0 278, 852.0 296, 932.0 284" fill="none" stroke="#a3f02e" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g class="l3">
        <text x="600.0" y="342" text-anchor="middle" class="f" font-size="19" fill="#8c909a">Fullstack developer from Hungary. I build <tspan fill="#f3f4ee" font-weight="600">websites and apps</tspan></text>
        <text x="600.0" y="370" text-anchor="middle" class="f" font-size="19" fill="#8c909a">— and keep them running while you sleep.</text>
        <rect x="430.0" y="398" width="30" height="26" rx="8" fill="#a3f02e" fill-opacity=".12" stroke="#a3f02e" stroke-opacity=".35"/>
        <path d="M438.0 411 l4 4 l8 -8" fill="none" stroke="#a3f02e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="472.0" y="416" class="f" font-size="15" fill="#8c909a">From idea to production — one pair of hands.</text>
      </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="459" rx="28" fill="none" stroke="#ffffff14"/></svg>